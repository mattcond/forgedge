[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgedge"
version = "0.1.3"
description = "FORGE — Feature-Oriented Rule Generation Engine for systematic alpha discovery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-xdist>=3.0", "pyarrow>=10.0"]

[project.urls]
Homepage = "https://github.com/mattcond/forgedge"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = [
    "slow: full-grid Rule Discovery / large-dataset (>=4000 bars) pipeline tests. Dominate suite runtime; deselect with -m 'not slow' for the fast dev loop, run the full suite (this default) before pushing.",
]
