# KPI Builder — configurazione di riferimento (esempio modificabile).
#
# Struttura: <nome_indicatore>: { enabled: bool, params: { periods: [...], columns: [...] } }
#
# Note:
#  - La colonna del timestamp NON va qui: è il parametro `timestamp_col` di build_features().
#  - I nomi delle colonne di output sono fissati dalle funzioni indicatore
#    (es. close_ema_25, close_bb_lower_20) perché il FeatureGenerator di FORGE li riconosce.
#  - Le colonne referenziate ma assenti nei dati (es. volume su dati OHLC) vengono saltate.
#  - Il LAG non è qui: si applica dopo, con lag_features(df, *cols), su colonne reali.

moving_average:
  enabled: true
  params:
    periods: [3, 9, 12, 25, 96, 168]
    columns: [close, high, low, volume]

ema:
  enabled: true
  params:
    periods: [3, 9, 12, 25, 96, 168]
    columns: [close, high, low]

volatility:
  enabled: true
  params:
    periods: [5, 12, 24, 96, 168]
    columns: [close]

min:
  enabled: true
  params:
    periods: [3, 6, 12, 24, 48, 96, 168]
    columns: [close, high, low]

max:
  enabled: true
  params:
    periods: [3, 6, 12, 24, 48, 96, 168]
    columns: [close, high, low]

return:
  enabled: true
  params:
    periods: [1, 3, 6, 12, 24, 48, 96, 168]
    columns: [close]

rsi:
  enabled: true
  params:
    periods: [14, 25]
    columns: [close]

bollinger_bands:
  enabled: true
  params:
    periods: [20]
    columns: [close]

max_drawdown:
  enabled: true
  params:
    periods: [12, 24, 48, 120, 240]
    columns: [close]

# ATR richiede high/low oltre a `columns` (di solito solo "close"): disabilitato
# di default per non rompere consumatori OHLC-only senza high/low. Due periodi
# (non uno) perché FeatureGenerator possa accoppiare atr14/atr28 (e
# natr14/natr28) in un ratio scale-free — come EMA, ATR non è limitato e non è
# affidabilmente scale-free da solo, vedi indicators.multiple_atr.
atr:
  enabled: false
  params:
    periods: [14, 28]
    columns: [close]

# MACD: `periods` è una lista piatta di triple (fast, slow, signal), non
# finestre indipendenti — vedi indicators.multiple_macd. [12,26,9] = un MACD
# standard; [12,26,9, 5,35,5] produrrebbe due configurazioni MACD.
macd:
  enabled: false
  params:
    periods: [12, 26, 9]
    columns: [close]

# NB: indicator_lag_cross (Event Discovery, non KPI Builder) — NON va qui.
# FeatureGenerator genera automaticamente confronti indicatore-vs-base-OHLC
# sfasata nel tempo (es. close_sma_12[t] > low[t-3]), limitati alle famiglie
# price-scale (SMA/EMA/WMA/HMA), lag di default (1, 3). Non è un indicatore
# KPI Builder e non viene letto da questo file a runtime — cambiare il lag
# richiede DiscoveryConfig(indicator_lag_cross_lags=(...)) in Python, non un
# blocco qui (che verrebbe solo ignorato con un warning "non implementato").
# Documentato qui unicamente come riferimento incrociato per chi legge prima
# questo file. Vedi FeatureGenerator._generate_indicator_lag_cross.
