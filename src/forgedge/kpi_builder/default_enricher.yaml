# KPI Builder — configurazione di riferimento (esempio modificabile).
#
# Struttura: <nome_indicatore>: { enabled: bool, params: { periods: [...], columns: [...] } }
#
# Note:
#  - La colonna del timestamp NON va qui: è il parametro `timestamp_col` di build_kpi_table().
#  - I nomi delle colonne di output sono fissati dalle funzioni indicatore
#    (es. close_ema_25, close_bb_lower_20) perché il FeatureGenerator di FORGE li riconosce.
#  - Le colonne referenziate ma assenti nei dati (es. volume su dati OHLC) vengono saltate.
#  - 'lagging' è la FASE 2: può ritardare anche colonne DERIVATE in fase 1 (es. close_ema_03).

moving_average:
  enabled: true
  params:
    periods: [3, 9, 12, 25, 96, 168]
    columns: [close, high, low, volume]

ema:
  enabled: true
  params:
    periods: [3, 9, 12, 25, 96, 168]
    columns: [close, high, low]

volatility:
  enabled: true
  params:
    periods: [5, 12, 24, 96, 168]
    columns: [close]

min:
  enabled: true
  params:
    periods: [3, 6, 12, 24, 48, 96, 168]
    columns: [close, high, low]

max:
  enabled: true
  params:
    periods: [3, 6, 12, 24, 48, 96, 168]
    columns: [close, high, low]

return:
  enabled: true
  params:
    periods: [1, 3, 6, 12, 24, 48, 96, 168]
    columns: [close]

rsi:
  enabled: true
  params:
    periods: [14, 25]
    columns: [close]

bollinger_bands:
  enabled: true
  params:
    periods: [20]
    columns: [close]

max_drawdown:
  enabled: true
  params:
    periods: [12, 24, 48, 120, 240]
    columns: [close]

lagging:
  enabled: true
  params:
    periods: [1, 2, 3]
    columns: [close, high, low, volume, color,
              close_ema_03, close_ema_12, close_ema_25,
              close_sma_03, close_sma_12, close_sma_25, volume_sma_03,
              high_max_168, close_max_168, low_min_168, close_min_168]
